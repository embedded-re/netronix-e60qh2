Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoAddGPU" "false"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection
Section "Device"
    Identifier "EPDC"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
    Option "ShadowFB" "true"
    # portrait 1072x1448; touch follows via the CTM set in e60-session
    Option "Rotate" "CCW"
EndSection
Section "Monitor"
    Identifier "EInk"
EndSection
Section "Screen"
    Identifier "Reader"
    Device "EPDC"
    Monitor "EInk"
    DefaultDepth 24
EndSection
Section "InputDevice"
    Identifier "Touch"
    Driver "evdev"
    Option "Device" "/dev/input/e60-touch"
EndSection
Section "InputDevice"
    Identifier "Buttons"
    Driver "evdev"
    Option "Device" "/dev/input/e60-buttons"
EndSection
Section "ServerLayout"
    Identifier "ReaderLayout"
    Screen "Reader"
    InputDevice "Touch" "CorePointer"
    InputDevice "Buttons" "CoreKeyboard"
EndSection
